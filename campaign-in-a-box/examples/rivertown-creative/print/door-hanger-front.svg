<text x="153.00" y="210.91" font-family="&#x27;Public Sans&#x27;, Arial Black, Arial, sans-serif" font-weight="900" font-size="61.97" fill="#FFFFFF" text-anchor="middle">PORTER</text>
<text x="153.00" y="232.61" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="16.11" fill="#F2B705" text-anchor="middle" letter-spacing="0.97">CITY COUNCIL · DISTRICT 4</text>
<text x="18.00" y="485.91" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="22.00" fill="#0B4F5C" text-anchor="start">He cleared Mill Creek.</text>
<text x="18.00" y="509.67" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="22.00" fill="#0B4F5C" text-anchor="start">He&#x27;ll clear the backlog.</text>
<text x="18.00" y="537.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">Chris Porter will finally fix east-side</text>
<text x="18.00" y="553.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">flooding, because he&#x27;s an engineer who</text>
<text x="18.00" y="569.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">already got Mill Creek cleared — while City</text>
<text x="18.00" y="585.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">Hall has left it &quot;pending&quot; for six years.</text>
<text x="100.00" y="694.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="12.00" fill="#0B4F5C" text-anchor="start">Scan to see Chris&#x27;s plan</text>
<text x="100.00" y="732.00" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="9.50" fill="#13232B" text-anchor="start">chrisporter.example</text>
</g>
