<text x="18.00" y="146.46" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="20.00" fill="#FFFFFF" text-anchor="start">¡Perdón, no lo encontramos!</text>
<text x="26.00" y="208.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="9.00" fill="#0B4F5C" text-anchor="start">Una nota de su vecino:</text>
<text x="18.00" y="318.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="11.00" fill="#B4441F" text-anchor="start" letter-spacing="0.80">LAS PRIORIDADES DE CHRIS</text>
<text x="18.00" y="338.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">Resolver las inundaciones del lado este</text>
<text x="18.00" y="353.64" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Terminar el estudio de drenaje y buscar primero</text>
<text x="18.00" y="367.08" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">fondos estatales y federales.</text>
<text x="18.00" y="390.52" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">Permisos más rápidos para pequeños</text>
<text x="18.00" y="407.16" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">negocios</text>
<text x="18.00" y="422.80" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Reactivar el programa piloto de permisos para que los</text>
<text x="18.00" y="436.24" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">dueños reciban respuesta en semanas, no meses.</text>
<text x="18.00" y="459.68" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">Un camino seguro a la Escuela Lincoln</text>
<text x="18.00" y="475.32" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Banquetas, cruces peatonales e iluminación en la ruta</text>
<text x="18.00" y="488.76" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">que de verdad usan los niños.</text>
