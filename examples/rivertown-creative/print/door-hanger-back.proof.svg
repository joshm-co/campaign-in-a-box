<g id="text" inkscape:groupmode="layer" inkscape:label="text">
<text x="18.00" y="147.91" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="22.00" fill="#FFFFFF" text-anchor="start">Sorry we missed you!</text>
<text x="26.00" y="208.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="9.00" fill="#0B4F5C" text-anchor="start">A note from your neighbor:</text>
<text x="18.00" y="318.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="11.00" fill="#B4441F" text-anchor="start" letter-spacing="0.80">CHRIS&#x27;S PRIORITIES</text>
<text x="18.00" y="338.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">Fix east-side flooding</text>
<text x="18.00" y="353.64" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Finish the drainage study and go after state and</text>
<text x="18.00" y="367.08" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">federal flood grants first.</text>
<text x="18.00" y="390.52" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">Faster permits for small businesses</text>
<text x="18.00" y="406.16" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Restart the permit-streamlining pilot so owners get</text>
<text x="18.00" y="419.60" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">answers in weeks, not months.</text>
<text x="18.00" y="443.04" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="13.00" fill="#0B4F5C" text-anchor="start">A safe walk to Lincoln Elementary</text>
<text x="18.00" y="458.68" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">Sidewalks, crossings and lighting on the route kids</text>
<text x="18.00" y="472.12" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="10.50" fill="#13232B" text-anchor="start">actually walk.</text>
<text x="18.00" y="499.56" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="9.00" fill="#B4441F" text-anchor="start" letter-spacing="0.80">THE RECORD</text>
<text x="18.00" y="513.56" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="600" font-size="10.50" fill="#13232B" text-anchor="start">The east-side drainage study has been &quot;pending&quot; for</text>
<text x="18.00" y="527.00" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="600" font-size="10.50" fill="#13232B" text-anchor="start">six years.</text>
<text x="18.00" y="540.44" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="8.00" fill="#13232B" text-anchor="start">Source: Rivertown City Council minutes, 2021–2027</text>
</g>
