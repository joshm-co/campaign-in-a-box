<text x="18.00" y="485.91" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="22.00" fill="#0B4F5C" text-anchor="start">Despejó Mill Creek.</text>
<text x="18.00" y="509.67" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="22.00" fill="#0B4F5C" text-anchor="start">Despejará el rezago.</text>
<text x="18.00" y="537.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">Chris Porter va a resolver por fin las</text>
<text x="18.00" y="553.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">inundaciones del lado este, porque es</text>
<text x="18.00" y="569.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">ingeniero y ya logró despejar Mill Creek,</text>
<text x="18.00" y="585.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">mientras el Ayuntamiento lo ha dejado</text>
<text x="18.00" y="601.67" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="12.50" fill="#13232B" text-anchor="start">&quot;pendiente&quot; por seis años.</text>
<text x="100.00" y="694.00" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="12.00" fill="#0B4F5C" text-anchor="start">Escanee para ver el plan de</text>
<text x="100.00" y="709.36" font-family="&#x27;Public Sans&#x27;, Arial, sans-serif" font-weight="700" font-size="12.00" fill="#0B4F5C" text-anchor="start">Chris</text>
<text x="100.00" y="732.00" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-weight="400" font-size="9.50" fill="#13232B" text-anchor="start">chrisporter.example</text>
