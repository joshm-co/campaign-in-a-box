# Publishes the no-code app (campaign-in-a-box/app/) to GitHub Pages.
# Turn on once: Settings → Pages → Source: GitHub Actions.
name: Publish app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["campaign-in-a-box/app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # A push made by the results collector doesn't start this workflow on its own, so listen for it.
  workflow_run:
    workflows: ["Collect Utah results"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the app's math against tools/targeting.py
        working-directory: campaign-in-a-box
        run: node app/tests/strategy.test.js && python3 tools/collect_utah_results.py --self-test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campaign-in-a-box/app
      - id: deployment
        uses: actions/deploy-pages@v4
